<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="福州菜视频菜谱合集：92 道家常闽菜，按分类、主料、做法快速找到要做的菜。">
<title>福州菜 · 视频菜谱</title>
<style>
:root{
  --bg:#faf6f0; --card:#fffdfa; --ink:#221a14; --muted:#8b7a6b; --line:#e9dfd1;
  --accent:#bd3a24; --accent-2:#8a2b1b; --soft:#f7e8e1; --chip:#f3ebe0; --shadow:0 1px 2px rgba(70,45,25,.06),0 8px 22px -14px rgba(70,45,25,.28);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#131010; --card:#1c1714; --ink:#f3e9dd; --muted:#a2917f; --line:#2d241d;
  --accent:#e4643f; --accent-2:#f08a63; --soft:#2a1b15; --chip:#241b16;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -18px rgba(0,0,0,.9);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#131010; --card:#1c1714; --ink:#f3e9dd; --muted:#a2917f; --line:#2d241d;
    --accent:#e4643f; --accent-2:#f08a63; --soft:#2a1b15; --chip:#241b16;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -18px rgba(0,0,0,.9);
  }
  html[data-theme="auto"]{ color-scheme:dark }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
html[data-fs="lg"] body{font-size:18.5px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{display:block}

/* ---------- header ---------- */
.wrap{max-width:1220px;margin:0 auto;padding:0 clamp(12px,3.4vw,28px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 14px}
header.top>div:first-child{min-width:0}
h1{margin:0;font-family:"Songti SC","Noto Serif SC",Georgia,"SimSun",serif;font-weight:700;
   font-size:clamp(21px,5.6vw,33px);letter-spacing:.06em;line-height:1.15;white-space:nowrap}
h1 em{font-style:normal;font-size:.52em;letter-spacing:.22em;color:var(--muted);margin-left:.5em;vertical-align:.18em}
h1 .dot{color:var(--accent);margin:0 .12em}
.stats{margin:7px 0 0;color:var(--muted);font-size:.78rem;letter-spacing:.02em}
.htools{display:flex;gap:8px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:.82rem;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.96)}

/* ---------- sticky controls ---------- */
.dock{position:sticky;top:0;z-index:30;padding:8px 0 10px;background:var(--bg);
  border-bottom:1px solid transparent;transition:border-color .2s}
.dock.stuck{border-bottom-color:var(--line)}
.searchrow{display:flex;gap:8px}
.search{position:relative;flex:1;display:flex;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.search svg{flex:none;margin-left:12px;opacity:.55}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;
  font-size:16px;padding:11px 8px;outline:none}
.search input::placeholder{color:var(--muted)}
#qClear{flex:none;width:34px;height:34px;margin-right:4px;border-radius:10px;color:var(--muted);display:none}
.search.has-q #qClear{display:grid;place-items:center}
.dice{flex:none;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);color:var(--accent);font-size:.86rem;font-weight:700;letter-spacing:.04em}
.dice:active{transform:scale(.96)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.chips.overflowing{mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%);
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font-size:.83rem;font-weight:600;white-space:nowrap;scroll-snap-align:start;
  transition:.16s}
.chip b{font-weight:600;opacity:.62;margin-left:.25em;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] b{opacity:.8}
.chip.is-fav[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2)}

/* ---------- recent rail ---------- */
.rail-wrap{padding:14px 0 4px}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.rail-head h2{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.rail-head button{font-size:.74rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mini{flex:none;width:104px;text-align:left}
.mini .mt{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--chip);
  border:1px solid var(--line)}
.mini img{width:100%;height:100%;object-fit:cover}
.mini span{display:block;font-size:.72rem;line-height:1.3;margin-top:5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- grid ---------- */
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}
.count{font-size:.8rem;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.sortbox{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.sortbox select{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:5px 26px 5px 10px;font:inherit;font-size:16px;line-height:1.2;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.grid{display:grid;gap:clamp(9px,2.6vw,16px);grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));
  padding-bottom:8px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;
  transition:transform .16s ease,border-color .16s}
.card:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:3/4;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.card:hover .thumb img{transform:scale(1.045)}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;
  background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}
.play-ic{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:rgba(255,255,255,.86);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);
  opacity:0;transition:opacity .2s}
.play-ic svg{margin-left:2px}
.card:hover .play-ic{opacity:1}
@media (hover:none){.play-ic{opacity:.92;width:38px;height:38px;margin:-19px 0 0 -19px}}
.dur{position:absolute;right:8px;bottom:8px;z-index:2;padding:2px 7px;border-radius:7px;
  background:rgba(14,10,8,.66);color:#fff;font-size:.68rem;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;backdrop-filter:blur(3px)}
.badge{position:absolute;left:8px;top:8px;z-index:2;padding:2px 7px;border-radius:7px;font-size:.66rem;
  font-weight:700;letter-spacing:.04em;background:var(--accent);color:#fff}
.card .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px}
.card h3{margin:0;font-size:.94rem;font-weight:650;line-height:1.25;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{margin:0;font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{position:absolute;right:4px;top:4px;z-index:3;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;font-size:1.05rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55);
  transition:transform .14s}
.fav:active{transform:scale(.86)}
.fav[aria-pressed="true"]{color:#ff5a3c}
.empty{margin:44px auto;max-width:340px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:6px}

footer{margin:28px 0 0;padding:18px 0 calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);color:var(--muted);font-size:.74rem;line-height:1.8}
footer code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:.92em}
.totop{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  width:46px;height:46px;border-radius:50%;display:none;place-items:center;font-size:1.15rem;
  color:var(--accent);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.totop.on{display:grid}
.hint{display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;padding:11px 13px;border-radius:12px;
  background:var(--soft);color:var(--accent-2);font-size:.78rem;line-height:1.55}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:80;background:#070605;color:#f4ece2;
  display:flex;flex-direction:column;height:100dvh;overscroll-behavior:contain;
  padding:max(0px,env(safe-area-inset-top)) 0 max(0px,env(safe-area-inset-bottom))}
.player[hidden]{display:none}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none}
.pbar .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;
  box-shadow:none;width:38px;height:38px}
.ptitle{min-width:0;flex:1}
.ptitle h2{margin:0;font-size:1rem;font-weight:650;line-height:1.2;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ptitle p{margin:2px 0 0;font-size:.72rem;color:#b6a696;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstage{flex:1;min-height:0;display:block;background:#000;overflow:hidden}
.pstage video{display:block;width:100%;height:100%;max-height:100%;object-fit:contain;background:#000}
.pfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px 12px}
.nav{padding:11px 15px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;
  border:1px solid rgba(255,255,255,.14);font-size:.82rem;font-weight:600;min-width:88px}
.nav:disabled{opacity:.35}
.nav:active{background:rgba(255,255,255,.18)}
.pacts{display:flex;gap:8px}
.pacts button{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:#e9dfd3;font-size:.78rem;font-variant-numeric:tabular-nums}
#pfav{font-size:1.05rem}
#pfav[aria-pressed="true"]{color:#ff6a48}
</style>
</head>

const DISHES = DB.dishes, CATS = DB.cats, STATS = DB.stats;

const $ = (s, r = document) => r.querySelector(s);
const grid = $('#grid'), chips = $('#chips'), qEl = $('#q'), player = $('#player'), video = $('#video');

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let favs = new Set(LS.get('fz:fav', []));
let recent = LS.get('fz:recent', []);
let state = { q: '', cat: '', favOnly: false, sort: 'cat' };

const fmt = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const byId = id => DISHES.find(d => d.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const srcOf = d => '福州菜/' + encodeURIComponent(d.file);
const thumbOf = d => encodeURI(d.thumb);

/* ---------- header stats ---------- */
$('#stats').textContent = `${STATS.n} 道 · 约 ${Math.floor(STATS.minutes / 60)} 小时 ${STATS.minutes % 60} 分 · ${STATS.gb} GB`;

/* ---------- chips ---------- */
function buildChips() {
  const c = [...CATS.map(cat => ({ id: cat, label: cat, n: DISHES.filter(d => d.cat === cat).length })),
             { id: '__fav', label: '♥ 收藏', n: favs.size, cls: 'is-fav' }];
  chips.innerHTML = `<button class="chip" data-cat="" aria-pressed="true">全部<b>${DISHES.length}</b></button>` +
    c.map(x => `<button class="chip ${x.cls || ''}" data-cat="${x.id}" aria-pressed="false">${x.label}<b>${x.n}</b></button>`).join('');
  syncChipsFade();
}
function syncChipsFade() {
  const c = chips;
  c.classList.toggle('overflowing', c.scrollWidth - c.clientWidth - c.scrollLeft > 4);
}
chips.addEventListener('scroll', syncChipsFade, { passive: true });
addEventListener('resize', syncChipsFade);

chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const v = b.dataset.cat;
  if (v === '__fav') { state.favOnly = !state.favOnly; state.cat = ''; }
  else { state.cat = v; state.favOnly = false; }
  [...chips.children].forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- filtering ---------- */
function visible() {
  const q = state.q.trim().toLowerCase();
  let list = DISHES.filter(d => {
    if (state.cat && d.cat !== state.cat) return false;
    if (state.favOnly && !favs.has(d.id)) return false;
    if (!q) return true;
    return (d.name + ' ' + d.cat + ' ' + d.method + ' ' + d.ing.join(' ')).toLowerCase().includes(q);
  });
  const cmpName = (a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN');
  if (state.sort === 'name') list.sort(cmpName);
  else if (state.sort === 'dur-') list.sort((a, b) => a.dur - b.dur);
  else if (state.sort === 'dur+') list.sort((a, b) => b.dur - a.dur);
  return list;
}

/* ---------- render ---------- */
function cardHTML(d) {
  const isFav = favs.has(d.id);
  const isDup = /\(1\)$/.test(d.name);
  return `<article class="card" data-id="${d.id}">
    <div class="thumb">
      <img loading="lazy" decoding="async" src="${thumbOf(d)}" alt="${esc(d.name)}">
      ${isDup ? '<span class="badge">备用版</span>' : ''}
      <span class="dur">${fmt(d.dur)}</span>
      <span class="play-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="#c0392b"><path d="M8 5v14l11-7z"/></svg></span>
    </div>
    <div class="body">
      <h3>${esc(d.name.replace(/\s*\(1\)$/, ''))}</h3>
      <p class="sub">${esc(d.method)} · ${esc(d.ing.slice(0, 2).join(' '))}</p>
    </div>
    <button class="fav" data-fav="${d.id}" aria-pressed="${isFav}" aria-label="收藏 ${esc(d.name)}">${isFav ? '♥' : '♡'}</button>
  </article>`;
}

function render() {
  const list = visible();
  grid.innerHTML = list.map(cardHTML).join('');
  $('#count').innerHTML = state.q || state.cat || state.favOnly
    ? `筛选出 <b>${list.length}</b> 道`
    : `共 <b>${DISHES.length}</b> 道`;
  const empty = $('#empty');
  if (!list.length) {
    empty.hidden = false;
    empty.innerHTML = state.favOnly
      ? '<b>还没有收藏的菜</b>点卡片右上角的 ♡ 收藏，做饭时先看它们。'
      : `<b>没找到「${esc(state.q)}」</b>换个词试试：糟、虾、排骨、汤、面、鸡…`;
  } else empty.hidden = true;
  renderRail();
}

grid.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f) { toggleFav(+f.dataset.fav); return; }
  const c = e.target.closest('.card');
  if (c) open(+c.dataset.id);
});

/* ---------- favourites ---------- */
function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  LS.set('fz:fav', [...favs]);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => {
    const on = favs.has(id);
    b.setAttribute('aria-pressed', on); b.textContent = on ? '♥' : '♡';
  });
  if (cur && cur.id === id) syncPFav();
  buildChips(); keepChipPressed();
  if (state.favOnly) render();
}
function keepChipPressed() {
  const sel = state.favOnly ? '__fav' : (state.cat || '');
  [...chips.children].forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cat === sel)));
}

/* ---------- recent ---------- */
function pushRecent(id) {
  recent = [id, ...recent.filter(x => x !== id)].slice(0, 8);
  LS.set('fz:recent', recent);
}
function renderRail() {
  const items = recent.map(byId).filter(Boolean);
  const wrap = $('#railWrap');
  wrap.hidden = items.length === 0;
  if (!items.length) return;
  $('#rail').innerHTML = items.map(d =>
    `<button class="mini" data-id="${d.id}">
       <div class="mt"><img loading="lazy" src="${thumbOf(d)}" alt=""></div>
       <span>${esc(d.name.replace(/\s*\(1\)$/, ''))}</span>
     </button>`).join('');
}
$('#rail').addEventListener('click', e => {
  const b = e.target.closest('.mini'); if (b) open(+b.dataset.id);
});
$('#clearRecent').addEventListener('click', () => { recent = []; LS.set('fz:recent', []); renderRail(); });

/* ---------- player ---------- */
let cur = null, curList = [], wakeLock = null, speeds = [1, 1.5, 2, 0.75], sp = 0;

async function grabWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) {}
}
function dropWakeLock() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }

function open(id) {
  const d = byId(id); if (!d) return;
  curList = visible().length ? visible() : DISHES;
  const i = curList.findIndex(x => x.id === id);
  if (i < 0) curList = [...curList, d];
  cur = d;
  video.src = srcOf(d);
  video.poster = thumbOf(d);
  video.playbackRate = speeds[sp = 0];
  $('#speed').textContent = '1×';
  $('#ptitle').textContent = d.name.replace(/\s*\(1\)$/, '');
  $('#psub').textContent = `${d.cat} · ${d.method} · ${d.ing.join(' / ')} · ${fmt(d.dur)}`;
  document.title = d.name + ' · 福州菜';
  syncPFav();
  player.hidden = false;
  document.body.style.overflow = 'hidden';
  video.play().catch(() => {});
  grabWakeLock();
  pushRecent(id);
  syncNav();
  try { history.replaceState(null, '', '#d=' + d.id); } catch (e) {}
}

function close() {
  player.hidden = true;
  document.body.style.overflow = '';
  video.pause(); video.removeAttribute('src'); video.load();
  document.title = '福州菜 · 视频菜谱';
  dropWakeLock();
  renderRail();
  cur = null;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

function step(n) {
  if (!cur) return;
  const i = curList.findIndex(x => x.id === cur.id);
  const t = curList[i + n];
  if (t) open(t.id);
}
function syncNav() {
  const i = curList.findIndex(x => x.id === (cur && cur.id));
  $('#pPrev').disabled = i <= 0;
  $('#pNext').disabled = i < 0 || i >= curList.length - 1;
}
function syncPFav() {
  const on = cur && favs.has(cur.id);
  $('#pfav').setAttribute('aria-pressed', String(!!on));
  $('#pfav').textContent = on ? '♥' : '♡';
}

$('#pClose').addEventListener('click', close);
$('#pPrev').addEventListener('click', () => step(-1));
$('#pNext').addEventListener('click', () => step(1));
$('#pfav').addEventListener('click', () => cur && toggleFav(cur.id));
$('#speed').addEventListener('click', () => {
  sp = (sp + 1) % speeds.length; video.playbackRate = speeds[sp];
  $('#speed').textContent = speeds[sp] + '×';
});
if (!document.pictureInPictureEnabled) $('#pip').hidden = true;
$('#pip').addEventListener('click', async () => {
  try {
    if (document.pictureInPictureElement) { await document.exitPictureInPicture(); return; }
    await video.requestPictureInPicture();
    // 进小窗后收起播放层，但视频继续播（不调 close()，否则会暂停并清掉 src）
    player.hidden = true;
    document.body.style.overflow = '';
    document.title = '福州菜 · 视频菜谱';
    cur = null;
    renderRail();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  } catch (e) {}
});
video.addEventListener('leavepictureinpicture', () => {
  video.pause();
  if (player.hidden) { video.removeAttribute('src'); video.load(); dropWakeLock(); }
});
video.addEventListener('play', grabWakeLock);
video.addEventListener('pause', dropWakeLock);
video.addEventListener('error', () => {
  if (video.getAttribute('src')) $('#psub').textContent = '⚠ 视频读不到：确认 福州菜/ 目录和本页在同一层';
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !player.hidden && !video.paused) grabWakeLock();
});

/* ---------- misc controls ---------- */
$('#random').addEventListener('click', () => {
  const list = visible().length ? visible() : DISHES;
  open(list[Math.floor(Math.random() * list.length)].id);
});
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

let t = 0;
qEl.addEventListener('input', () => {
  $('#searchWrap').classList.toggle('has-q', !!qEl.value);
  clearTimeout(t);
  t = setTimeout(() => { state.q = qEl.value; render(); }, 90);
});
$('#qClear').addEventListener('click', () => {
  qEl.value = ''; state.q = '';
  $('#searchWrap').classList.remove('has-q'); render(); qEl.focus();
});
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') qEl.blur(); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (!player.hidden) {
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  } else {
    if (e.key === '/') { e.preventDefault(); qEl.focus(); }
  }
});

/* theme */
const themeBtn = $('#themeBtn');
const order = ['auto', 'light', 'dark'], tname = { auto: '◐', light: '☀', dark: '☾' };
function setTheme(v) {
  document.documentElement.dataset.theme = v;
  themeBtn.textContent = tname[v];
  themeBtn.title = '配色：' + ({ auto: '跟随系统', light: '浅色', dark: '深色' })[v];
  LS.set('fz:theme', v);
}
setTheme(LS.get('fz:theme', 'auto'));
themeBtn.addEventListener('click', () => {
  const n = order[(order.indexOf(document.documentElement.dataset.theme) + 1) % 3];
  setTheme(n);
});

/* kitchen mode */
const fsBtn = $('#fsBtn');
function setFs(v) {
  document.documentElement.dataset.fs = v;
  fsBtn.setAttribute('aria-pressed', String(v === 'lg'));
  fsBtn.textContent = v === 'lg' ? 'A-' : 'A+';
  LS.set('fz:fs', v);
}
setFs(LS.get('fz:fs', 'md'));
fsBtn.addEventListener('click', () => setFs(document.documentElement.dataset.fs === 'lg' ? 'md' : 'lg'));

/* dock shadow on scroll */
const dock = $('#dock'), toTop = $('#totop');
addEventListener('scroll', () => {
  dock.classList.toggle('stuck', scrollY > 8);
  toTop.classList.toggle('on', scrollY > 700);
}, { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

/* file:// hint */
if (location.protocol === 'file:') $('#hint').hidden = false;

buildChips();
render();

/* 深链：index.html#d=12 直接打开某道菜 */
function fromHash() {
  const m = /#d=(\d+)/.exec(location.hash);
  if (m && byId(+m[1])) open(+m[1]);
}
fromHash();
addEventListener('hashchange', fromHash);
</script>
</body>
</html>
